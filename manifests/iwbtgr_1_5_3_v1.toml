rounding = "gm_banker"               # GameMaker banker's rounding

[action_profile]
name = "standard6x2"
actions = 12
encoding = "a = shoot_held*6 + 2*(h+1) + jump_held"
notes = "6 movement actions x shoot; shooting fires on the press edge"

[saves]
mode = "shoot_activated"             # source-faithful (save_shoot_mode)
