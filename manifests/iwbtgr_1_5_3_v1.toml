# Frozen exact-game pack: I Wanna Be The Guy: Remastered 1.5.3, v1
#
# This manifest is the version-freeze record for the first exact IWBTG
# game shipped in iwanna-gym.  The pack is byte-reproducible: building
# from the recorded source revision with the recorded importer version
# yields exactly the recorded pack checksum.  Re-freezing (any content
# change) bumps pack_version and re-records every value here, the
# content-checksum fixture, and the reference traces.

[pack]
pack_version = "iwbtgr_1_5_3_v1"
game_id = "iwbtgr_1_5_3"
title = "I Wanna Be The Guy: Remastered 1.5.3"
pack_file = "build/games/iwbtgr_1_5_3.iwpack"
pack_sha256 = "af31958a5b4ab83df95120d423de2758b28b4f0dfcd356371a72280b046f52c1"
build_reproducible = true            # two clean builds byte-identical
rooms = 27
gameplay_rooms = 20
gameplay_source_instances = 7337

[source]
game = "I Wanna Be The Guy: Remastered"
version = "1.5.3"
format = "GameMaker 8.2 gm82save text tree"
repository = "https://github.com/aut0mat1clol/IWBTGR-Autosplitter-mod"
repository_commit = "244c325667f12e106b07feaa167572ef97b7a575"
tree_root = "IWBTGR Source Files"
tree_sha256 = "b7763bcc0cdede07640076f1623893444baa58feefcaca93471eb734382ce73b"

[importer]
module = "iwanna_gym.games.iwbtgr_1_5_3.converter"
importer_version = "1.1.0"
build_command = "python -m iwanna_gym.games.iwbtgr_1_5_3 build <tree_root>"

[physics_profile]
