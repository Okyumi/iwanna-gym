trace_fullgame_sha256 = "5bc9d787bdce706c7950abcc5a2b7d15f57de723c84def987b54a68b85993e5a"
trace_rguy1_sha256 = "dfb0d499e311d9ac35a84956099b8d2c3470a79fa7486c4504d870a53281de46"
trace_birdo_sha256 = "b9001ddca8cec977cbfaa573eec699984529eac472bde3743a43f11c5f8a5712"

[deviations]
