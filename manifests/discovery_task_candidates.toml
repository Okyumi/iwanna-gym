# Discovery-benchmark task candidates (design/audit milestone, 2026-09-03)
#
# Contract: docs/discovery_benchmark_contract.md.  Evidence columns cite
# the committed audit (`python scripts/audit_discovery_candidates.py` →
# build/source_reports/discovery_screen_audit.json, regenerated from the
# source inventory; source files themselves are never committed) and the
# per-class source semantics in docs/iwbtgr_nonboss_mechanics.md.
#
# decision = "accept" means: accepted as a discovery-task candidate for
# the implementation milestone, CONDITIONAL on (a) the discovery
# observation profile closing leaks L1/L2 (contract section 7) and
# (b) per-task scripted-probe validation of claim B2 (an informed probe
# beats an uninformed probe); probe_status records that state.  Nothing
# here fabricates original-2007 content: game "iwbtg_original_2007" has
# NO rows and joins suite S1 only when its import genuinely exists.
#
# Screens are 800x608 source pixels, indexed (sx, sy) = (x//800, y//608).
# checkpoint gives the anchoring save/playerStart at its source
# coordinates; the runtime checkpoint_id is room:x:y of the STORED
# player position after activation (action_and_reset_semantics.md).
# Goals are declared as predicates and runtime-validated at
# implementation time (reach_region = enter the stated screen-region;
# activate_save = activate the stated save).

schema_version = 1
audit_date = 2026-09-03
contract = "docs/discovery_benchmark_contract.md"
evidence = "build/source_reports/discovery_screen_audit.json"

[defaults]
attempts_K = 25
attempt_frames_H = 2000          # 40 s of room-speed logic frames
memory_rule = "agent memory may persist across attempt resets; cleared on task reset"
hidden_state_rule = "theta and the per-task RNG seed are fixed across attempts"
policy_inputs = "discovery obs profile only; no task/room ids (contract section 7)"

