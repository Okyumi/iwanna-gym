[base]
package = ocean
env_name = puffer_iwanna
policy_name = Policy
rnn_name = Recurrent

[env]
level = 1
max_steps = 1500
reward_mode = 1
death_penalty = 1.0
random_goal = 0

[train]
total_timesteps = 20_000_000
learning_rate = 0.0015
num_envs = 4096
num_workers = 2
batch_size = 131072
minibatch_size = 32768
update_epochs = 1
gamma = 0.99
gae_lambda = 0.95
ent_coef = 0.01
checkpoint_interval = 200
device = cpu
