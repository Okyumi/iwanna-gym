[base]
package = ocean
env_name = puffer_iwanna
policy_name = Policy
rnn_name = Recurrent

[env]
level = 1
max_steps = 1500
reward_mode = 1
death_penalty = 1.0
random_goal = 0
; discovery task/attempt protocol (docs/discovery_benchmark_contract.md):
; discovery=1 -> one episode == one task of up to attempts_K attempts
; (per-attempt budget attempt_frames_H frames); obs_mode 0 = privileged
; legacy vector (forbidden for headline discovery runs), 1 = observable.
; task_seed nonzero pins the first task's seed (deterministic replay).
discovery = 0
attempts_K = 25
attempt_frames_H = 2000
obs_mode = 0
task_seed = 0
; registry-driven task loading (iwanna_gym/discovery resolves a task id
; to these numeric kwargs; the pack file path travels via the IWG_PACK
; environment variable because kwargs are numeric-only). The same path
; loads any compiled .iwpack (a future iwbtg_original_2007 pack included)
; without a binding rewrite.
use_pack = 0
use_level_file = 0
difficulty = 0
task_start_set = 0
task_start_room = -1
task_start_x = 0
task_start_y = 0
task_goal_set = 0
task_goal_room = -1
task_gx0 = 0
task_gy0 = 0
task_gx1 = 0
task_gy1 = 0

[train]
total_timesteps = 20_000_000
learning_rate = 0.0015
num_envs = 4096
num_workers = 2
batch_size = 131072
minibatch_size = 32768
update_epochs = 1
gamma = 0.99
gae_lambda = 0.95
ent_coef = 0.01
checkpoint_interval = 200
device = cpu
