; PufferLib Ocean 4.0.0 config for the iwanna discovery env.
; Pinned PufferLib: github.com/PufferAI/PufferLib @ 42f70d69 (4.0.0).
; Reproducible build/run: docs/pufferlib_integration.md.
;
; The [env] keys below are read verbatim by c_src/puffer/binding.c
; (my_init, via dict_get). File paths (pack / level) are NOT kwargs —
; they travel via the IWG_PACK / IWG_LEVEL_FILE environment variables
; (Dict values are doubles). The discovery task registry
; (iwanna_gym.discovery.binding_kwargs) emits exactly these keys + the
; env vars for any registered task.
[base]
env_name = iwanna

[vec]
total_agents = 4096
num_buffers = 8
num_threads = 8

[policy]
name = Recurrent
num_layers = 2
hidden_size = 128

[env]
num_agents = 1
max_steps = 50000
reward_mode = 0
death_penalty = 1.0
; discovery task/attempt protocol (docs/discovery_benchmark_contract.md)
discovery = 1
attempts_K = 25
attempt_frames_H = 2000
; observation mode: 0 = privileged legacy (ORACLE, forbidden for
; headline), 1 = observable (headline). Keep 1 for real runs.
obs_mode = 1
; controlled research room by default (set via IWG_LEVEL_FILE); switch to
; a native pack task with use_pack=1 + IWG_PACK + the task anchors below,
; all emitted by iwanna_gym.discovery.binding_kwargs(task_id).
use_pack = 0
difficulty = 0
task_start_set = 0
task_start_room = -1
task_start_x = 0
task_start_y = 0
task_goal_set = 0
task_goal_room = -1
task_gx0 = 0
task_gy0 = 0
task_gx1 = 0
task_gy1 = 0
task_seed = 0

[train]
; SHORT smoke budget — not a pilot. Scale up on real hardware.
total_timesteps = 2_000_000
learning_rate = 0.0015
gamma = 0.999
gae_lambda = 0.95
ent_coef = 0.01
vf_coef = 0.5
max_grad_norm = 0.5
minibatch_size = 32768
device = cpu
