display_name = "I Wanna Be The Guy (original) - released MMF2 source"
exact_version = "beta builds of 2008-01-31: iwbtgbeta(fs).mfa and iwbtgbeta(slomo).mfa; plus iwbtgALPHA5.mfa (2007-12-17)"
author = "Michael 'Kayin' O'Reilly"
original_format = "Multimedia Fusion 2 project (.mfa); ending.ccn compiled Clickteam file"
source_location = "https://kayin.moe/iwbtg/source/ (pointer repo: https://github.com/Kayinnasaki/IWBTG, commit bb5a6cb56149a1fb1198843e291af355d51bdfce; Google Drive mirror linked from its README)"
