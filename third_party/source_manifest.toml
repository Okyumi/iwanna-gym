license_status = "informal non-license by the author ('no particular rights... you gotta steal a little... Do as you will'); non-commercial-without-asking for companies; no crypto/NFT; NOT a redistribution license - do not commit"
checksum_sha256 = "c41928c4e6599b3535c7a1d0d4b0df4da6068184e037a899af4282b460678f76"
checksum_status = "verified-author-hosted-file-2026-09-01"
